<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pocket Packet Sniffer</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #0f1419; color: #e6e6e6; }
    header { display: flex; justify-content: space-between; align-items: center;
             padding: 12px 16px; background: #1a2129; }
    h1 { font-size: 18px; margin: 0; }
    h2 { font-size: 15px; margin: 0 0 8px; }
    #status { font-size: 13px; color: #8fbf7f; }
    main { display: grid; gap: 16px; padding: 16px; grid-template-columns: 2fr 1fr; }
    @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
    .side { display: grid; gap: 16px; align-content: start; }
    canvas { max-width: 100%; }
    #filter-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    #filter-bar input, #filter-bar select, #filter-bar button {
      background: #222c36; color: #e6e6e6; border: 1px solid #2a343f; border-radius: 4px;
      padding: 6px 8px; font-size: 13px; }
    #filter-bar input { flex: 1 1 140px; min-width: 0; }
    #filter-bar button { cursor: pointer; }
    .export { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px;
              font-size: 12px; color: #8b98a5; }
    .export a { color: #58a6ff; text-decoration: none; border: 1px solid #2a343f; border-radius: 4px;
                padding: 4px 8px; }
    #chart-total { font-size: 12px; color: #8b98a5; margin: 0 0 8px; }
    section { background: #1a2129; border-radius: 8px; padding: 12px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid #2a343f; white-space: nowrap; }
    ul { list-style: none; margin: 0; padding: 0; }
    li { padding: 8px; margin-bottom: 6px; border-left: 4px solid #5a6b7b; background: #222c36;
         border-radius: 4px; font-size: 13px; }
    li.sev-high { border-left-color: #e5534b; }
    li.sev-medium { border-left-color: #d29922; }
    li.sev-low { border-left-color: #3fb950; }
  </style>
</head>
<body>
  <header>
    <h1>Pocket Packet Sniffer</h1>
    <span id="status">connecting...</span>
  </header>
  <main>
    <section>
      <h2>Live packets</h2>
      <form id="filter-bar" onsubmit="return false">
        <select id="filter-protocol" aria-label="Protocol">
          <option value="">All protocols</option>
          <option>TCP</option><option>UDP</option><option>DNS</option><option>ARP</option><option>ICMP</option>
        </select>
        <input id="filter-host" type="text" placeholder="Host (exact IP)" aria-label="Host">
        <input id="filter-search" type="search" placeholder="Search packets" aria-label="Search">
        <button id="filter-clear" type="button">Clear</button>
      </form>
      <table>
        <thead>
          <tr><th>Time</th><th>Source</th><th>Destination</th><th>Protocol</th><th>Length</th><th>Info</th></tr>
        </thead>
        <tbody id="packet-rows"></tbody>
      </table>
      <div class="export" id="export-packets">
        Export these packets:
        <a id="export-packets-csv" href="/export/packets?format=csv" download>CSV</a>
        <a id="export-packets-json" href="/export/packets?format=json" download>JSON</a>
      </div>
    </section>
    <div class="side">
      <section id="chart-panel">
        <h2>Traffic by protocol</h2>
        <p id="chart-total">waiting for data...</p>
        <canvas id="protocol-chart" height="160"></canvas>
      </section>
      <section id="device-panel">
        <h2>Device inventory</h2>
        <table>
          <thead>
            <tr><th>Device</th><th>Packets</th><th>Bytes</th><th>Protocols</th><th>Last seen</th></tr>
          </thead>
          <tbody id="device-rows"></tbody>
        </table>
      </section>
      <section id="alert-feed">
        <h2>Alerts</h2>
        <ul id="alert-list"></ul>
        <div class="export" id="export-alerts">
          Export alerts:
          <a id="export-alerts-csv" href="/export/alerts?format=csv" download>CSV</a>
          <a id="export-alerts-json" href="/export/alerts?format=json" download>JSON</a>
        </div>
      </section>
    </div>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script>
    const POLL_MS = 1000;

    function fmtTime(ts) {
      return new Date(ts * 1000).toLocaleTimeString();
    }

    // textContent (never innerHTML) so captured network data cannot inject markup.
    function cell(text) {
      const td = document.createElement("td");
      td.textContent = text;
      return td;
    }

    // Current filter bar values as query parameters (protocol, host, q).
    function filterParams() {
      const params = new URLSearchParams();
      const protocol = document.getElementById("filter-protocol").value;
      const host = document.getElementById("filter-host").value.trim();
      const q = document.getElementById("filter-search").value.trim();
      if (protocol) params.set("protocol", protocol);
      if (host) params.set("host", host);
      if (q) params.set("q", q);
      return params;
    }

    function packetUrl() {
      const params = filterParams();
      params.set("limit", "50");
      return "/packets?" + params.toString();
    }

    // The packet export links always download exactly what the filters select.
    function updateExportLinks() {
      ["csv", "json"].forEach(fmt => {
        const params = filterParams();
        params.set("format", fmt);
        document.getElementById("export-packets-" + fmt).href = "/export/packets?" + params.toString();
      });
    }

    async function refreshPackets() {
      const res = await fetch(packetUrl());
      const packets = await res.json();
      const rows = packets.map(p => {
        const tr = document.createElement("tr");
        [fmtTime(p.ts), p.src, p.dst, p.protocol, p.length, p.info].forEach(v => tr.appendChild(cell(v)));
        return tr;
      });
      document.getElementById("packet-rows").replaceChildren(...rows);
    }

    async function refreshAlerts() {
      const res = await fetch("/alerts?limit=20");
      const alerts = await res.json();
      const items = alerts.map(a => {
        const li = document.createElement("li");
        li.className = "sev-" + String(a.severity).replace(/[^a-z]/gi, "");
        li.textContent = "[" + String(a.severity).toUpperCase() + "] " + a.rule + ": " +
                         a.description + " (" + fmtTime(a.ts) + ")";
        return li;
      });
      if (items.length === 0) {
        const li = document.createElement("li");
        li.textContent = "No alerts";
        items.push(li);
      }
      document.getElementById("alert-list").replaceChildren(...items);
    }

    async function refreshDevices() {
      const res = await fetch("/devices?window=300");
      const devices = await res.json();
      const rows = devices.map(d => {
        const tr = document.createElement("tr");
        [d.ip, d.packets, d.bytes, d.protocols.join(", "), fmtTime(d.last_seen)]
          .forEach(v => tr.appendChild(cell(v)));
        return tr;
      });
      if (rows.length === 0) {
        const tr = document.createElement("tr");
        const td = cell("No devices seen yet");
        td.colSpan = 5;
        tr.appendChild(td);
        rows.push(tr);
      }
      document.getElementById("device-rows").replaceChildren(...rows);
    }

    let chart = null;

    async function refreshStats() {
      const res = await fetch("/stats?window=60");
      const stats = await res.json();
      const labels = Object.keys(stats.by_protocol);
      const values = labels.map(k => stats.by_protocol[k]);
      document.getElementById("chart-total").textContent =
        stats.total + " packets in the last " + stats.window + " seconds";
      if (typeof Chart === "undefined") return;  // chart library could not load (offline)
      if (!chart) {
        chart = new Chart(document.getElementById("protocol-chart"), {
          type: "bar",
          data: { labels, datasets: [{ label: "Packets", data: values, backgroundColor: "#58a6ff" }] },
          options: {
            animation: false,
            plugins: { legend: { display: false } },
            scales: { y: { beginAtZero: true, ticks: { precision: 0 } } },
          },
        });
      } else {
        chart.data.labels = labels;
        chart.data.datasets[0].data = values;
        chart.update();
      }
    }

    async function refresh() {
      try {
        await refreshPackets();
        await refreshAlerts();
        await refreshStats();
        await refreshDevices();
        document.getElementById("status").textContent = "live - " + new Date().toLocaleTimeString();
      } catch (err) {
        document.getElementById("status").textContent = "offline";
      }
    }

    let debounce = null;
    function onFilterChange() {
      clearTimeout(debounce);
      updateExportLinks();
      debounce = setTimeout(() => refreshPackets().catch(() => {}), 250);
    }
    ["filter-protocol", "filter-host", "filter-search"].forEach(id => {
      document.getElementById(id).addEventListener("input", onFilterChange);
    });
    document.getElementById("filter-clear").addEventListener("click", () => {
      document.getElementById("filter-protocol").value = "";
      document.getElementById("filter-host").value = "";
      document.getElementById("filter-search").value = "";
      onFilterChange();
    });

    refresh();
    setInterval(refresh, POLL_MS);
  </script>
</body>
</html>
