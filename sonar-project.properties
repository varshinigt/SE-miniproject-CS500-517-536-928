# SonarQube Scanner Configuration (SEC-01)
# Pocket Packet Sniffer — Course: UE24CS341A
# Lead: Ritu Ravish (Security Lead)

sonar.projectKey=pocket-packet-sniffer
sonar.projectName=Pocket Packet Sniffer
sonar.projectVersion=1.0

# Paths to source code and test files
sonar.sources=src
sonar.tests=tests
sonar.inclusions=src/**
sonar.test.inclusions=tests/**
sonar.exclusions=**/__pycache__/**,demo/**,docs/**

# Language and test reporting
sonar.language=py
sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml

# Encoding
sonar.sourceEncoding=UTF-8
