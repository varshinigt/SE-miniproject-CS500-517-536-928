# Basic setup: runs the test suite in a clean Python container.
# Sniffer, parser and dashboard services will be added in Sprint 2 (NFR-PORT-01).
services:
  tests:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "pip install -r requirements.txt && pytest --cov=src --cov-branch"
