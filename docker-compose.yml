# Multi-service deployment for Pocket Packet Sniffer (NFR-PORT-01)
services:
  dashboard:
    build: .
    container_name: pocket-packet-dashboard
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PPS_DB_PATH=/app/data/sniffer.db
    volumes:
      - ./data:/app/data

  tests:
    build: .
    container_name: pocket-packet-tests
    working_dir: /app
    volumes:
      - .:/app
    command: pytest --cov=src --cov-branch --cov-report=term-missing
